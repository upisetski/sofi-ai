services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sofi
      POSTGRES_USER: sofi
      POSTGRES_PASSWORD: sofi
    ports:
      - '5432:5432'
    volumes:
      - sofi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sofi -d sofi']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sofi-postgres:

name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sofi
          POSTGRES_USER: sofi
          POSTGRES_PASSWORD: sofi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sofi -d sofi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://sofi:sofi@localhost:5432/sofi
      NODE_ENV: test
      VIBER_AUTH_TOKEN: test-viber-auth-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - name: Show Prettier diff
        run: |
          npx prettier --write src/application/job-worker.test.ts src/application/job-worker.ts src/application/viber-event-processing.test.ts src/application/ai-router.ts src/application/ai-router.test.ts src/application/viber-delivery-callback.ts src/integrations/viber/client.ts src/integrations/viber/client.test.ts
          git diff -- src/application/job-worker.test.ts src/application/job-worker.ts src/application/viber-event-processing.test.ts src/application/ai-router.ts src/application/ai-router.test.ts src/application/viber-delivery-callback.ts src/integrations/viber/client.ts src/integrations/viber/client.test.ts
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Build Docker image
        run: docker build -t sofi-ai:ci .
